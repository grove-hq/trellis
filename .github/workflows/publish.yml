name: Publish to npm

# Publishes `@grovehq/trellis` when a push to main carries a package.json
# version npm does not have yet. Dispatch it by hand to retry a failed publish.
#
# Authenticates through npm trusted publishing, so there is no token. Only the
# publish job can mint one: it checks out and installs nothing, and its
# `npm-publish` environment deploys from `main` alone.

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Pack
        id: pack
        run: |
          if [ "$(jq -r '.private // false' package.json)" = "true" ]; then
            echo "package.json is private; nothing to publish."
            exit 0
          fi
          mkdir out
          npm pack --ignore-scripts --pack-destination out
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Hand the tarball to the publish job
        if: steps.pack.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: out/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: pack
    if: needs.pack.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish it if npm does not have it
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          if npm view "@grovehq/trellis@${VERSION}" version >/dev/null 2>&1; then
            echo "@grovehq/trellis@${VERSION} is already on npm."
            exit 0
          fi
          # No package script runs beside the OIDC credential.
          npx --yes npm@11.21.0 publish package/*.tgz --ignore-scripts --access public
