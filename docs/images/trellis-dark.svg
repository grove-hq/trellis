<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Vines covering a thin trellis</title>
  <desc id="d">The trellis is the frame: a few files that a human ratifies every change to. The vines are all the other code, far more of it, which agents write and merge freely, and which grows along the frame, including code not written yet.</desc>

