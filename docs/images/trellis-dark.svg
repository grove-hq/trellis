  <g text-anchor="middle" fill="#f0f6fc" font-size="15">
    <text x="760" y="232" font-size="19" font-weight="600" fill="#3fb950">All the other code</text>
    <text x="760" y="260">Agents write and merge it</text>
    <text x="760" y="282">freely. It grows along</text>
    <text x="760" y="304">the frame.</text>
  </g>

  <text x="606" y="58" font-size="13" font-style="italic" fill="#9198a1">not written yet</text>
