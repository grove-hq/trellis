  <g text-anchor="middle" fill="#f0f6fc" font-size="15">
    <text x="140" y="232" font-size="19" font-weight="600" fill="#d29922">The frame</text>
    <text x="140" y="260">A few files that hold</text>
    <text x="140" y="282">the architecture.</text>
    <text x="140" y="304">A human ratifies every change.</text>
  </g>

